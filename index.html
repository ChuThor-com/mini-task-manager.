<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Quản Lý Công Việc Cá Nhân</h1>
            <p>Mini Task Manager</p>
        </header>

        <!-- FORM THÊM CÔNG VIỆC -->
        <section class="form-section">
            <h2>Thêm công việc mới</h2>
            <form id="task-form">
                <div class="form-group">
                    <label for="task-name">Tên công việc (*)</label>
                    <input type="text" id="task-name" placeholder="Nhập tên công việc...">
                    <span id="error-message" class="error"></span>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="task-deadline">Hạn hoàn thành</label>
                        <input type="date" id="task-deadline">
                    </div>
                    <div class="form-group">
                        <label for="task-priority">Mức ưu tiên</label>
                        <select id="task-priority">
                            <option value="Cao">Cao</option>
                            <option value="Trung bình" selected>Trung bình</option>
                            <option value="Thấp">Thấp</option>
                        </select>
                    </div>
                </div>

                <button type="submit" id="add-btn">Thêm công việc</button>
            </form>
        </section>

        <!-- TÌM KIẾM & LỌC -->
        <section class="filter-section">
            <h2>Tìm kiếm & Lọc</h2>
            <div class="filter-row">
                <input type="text" id="search-input" placeholder="Tìm theo tên công việc...">
                <select id="filter-status">
                    <option value="all">Tất cả</option>
                    <option value="pending">Chưa hoàn thành</option>
                    <option value="completed">Đã hoàn thành</option>
                </select>
            </div>
        </section>

        <!-- DANH SÁCH CÔNG VIỆC -->
        <section class="list-section">
            <h2>Danh sách công việc</h2>
            <ul id="task-list">
                <!-- JavaScript sẽ render vào đây -->
            </ul>
            <p id="empty-message" class="empty-message">Không có công việc nào phù hợp.</p>
        </section>

        <!-- FOOTER -->
        <footer>
            <p>Họ tên: Chu Thị Phương Thảo - MSSV: 224001747 - Lớp: TUD D2024</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
